# DisgoroQ Configuration File
# Copy this file to config.yaml and fill in your values.
# Environment variables can be interpolated using ${VAR_NAME} or ${VAR_NAME:-default} syntax.

discord:
  # Required: Discord bot token (use environment variable for security)
  token: "${DISCORD_TOKEN}"

  # Development guilds for fast slash-command registration when running in local mode
  dev_guild_ids: []

database:
  # Database URL (required for remote Turso database)
  # Use ${DB_URL} for security
  url: "${DB_URL}"

  # Database authentication token (required for remote Turso database)
  # Use ${DB_TOKEN} for security
  token: "${DB_TOKEN}"

  # Set to true to use local SQLite database instead of Turso
  # When true, url and token are not required
  local: false

ai:
  # Primary AI provider to use by default: "groq", "ollama", "opencode", or "openrouter"
  primary_provider: "${AI_PRIMARY_PROVIDER:-groq}"

  groq:
    # Required when primary_provider is "groq" or when using Groq as fallback
    api_key: "${GROQ_API_KEY:-}"

    # Model to use for chat completions
    model: "openai/gpt-oss-20b"

    # Model to use for vision requests
    vision_model: "meta-llama/llama-4-scout-17b-16e-instruct"

    # Use the model's default reasoning/thinking behavior
    # Set to false to ask Groq for a lower/no reasoning effort when supported by the selected model
    thinking_enabled: true

  ollama:
    # Enable Ollama as a configured provider (required when primary_provider is "ollama")
    enabled: false

    # Ollama server URL
    url: "http://localhost:11434"

    # Model to use for chat completions
    model: "dolphin3"

    # Model to use for vision requests
    vision_model: "llava"

    # Enable/disable Ollama's "think" request flag
    thinking_enabled: false

  opencode:
    # Enable OpenCode Go as a configured provider (required when primary_provider is "opencode")
    enabled: false

    # OpenCode Go OpenAI-compatible base URL
    base_url: "https://opencode.ai/zen/go/v1"

    # Required when primary_provider is "opencode" or when using OpenCode as fallback
    api_key: "${OPENCODE_API_KEY:-}"

    # Model to use for chat completions
    model: "deepseek-v4-flash"

    # Model to use for attachment description requests
    # Use a model that accepts OpenAI-compatible image_url content if you want image attachments processed
    vision_model: "deepseek-v4-flash"

    # Use the model's default reasoning/thinking behavior
    # Set to false to send reasoning_effort: none on OpenCode chat requests
    thinking_enabled: true

  openrouter:
    # Enable OpenRouter as a configured provider (required when primary_provider is "openrouter")
    enabled: false

    # OpenRouter OpenAI-compatible base URL
    base_url: "https://openrouter.ai/api/v1"

    # Required when primary_provider is "openrouter" or when using OpenRouter as fallback
    api_key: "${OPENROUTER_API_KEY:-}"

    # Model to use for chat completions
    model: "google/gemini-2.5-flash"

    # Model to use for attachment description requests
    # Set this equal to model to allow inline multimodal chat for image attachments
    vision_model: "google/gemini-2.5-flash"

    # Use the model's default reasoning/thinking behavior
    # Set to false to send OpenRouter's normalized reasoning config with effort: none
    thinking_enabled: true

  retry:
    # Maximum number of retry attempts
    max_retries: 2

    # Initial delay between retries in milliseconds
    initial_delay_ms: 500

    # Maximum delay between retries in milliseconds
    max_delay_ms: 5000

    # Exponential backoff factor
    backoff_factor: 2.0

    # Retry when response is empty
    retry_on_empty: true

    # Retry when API returns an error
    retry_on_error: true

  # Enable fallback to the other configured providers when the primary provider fails
  fallback_enabled: true

  # Minimum response length to accept
  min_response_length: 1

  tools:
    # Enable provider tool/function calling
    enabled: true

    # Maximum assistant->tool->assistant rounds per reply
    max_rounds: 3

    # Maximum number of tool calls accepted in a single round
    max_calls_per_round: 2

    # Maximum number of tool calls accepted across the full reply
    max_calls_total: 4

    # Per-tool execution timeout in milliseconds
    timeout_ms: 10000

    web:
      # Enable the built-in web fetch tool
      enabled: true

      # Allowed URL schemes for web fetches
      allowed_schemes: ["http", "https"]

      # User-Agent sent to remote servers
      user_agent: "DisgoroQ/1.0 (+https://github.com/polynux/disgoroq)"

      # Maximum number of bytes downloaded per request
      max_bytes: 2097152

      # Maximum number of characters returned to the model
      max_characters: 12000

      # Allow access to localhost/private network targets
      allow_private_networks: false

logging:
  # Enable logging
  enabled: true

  # Log to database (requires database to be configured)
  log_to_db: false

  # Enable event logging
  event_logging_enabled: true

  # Log level: debug, info, warn, error
  level: "info"

  # Log encoding: json, console
  encoding: "json"

  # Number of days to retain logs
  retention_days: 7

  # Database log level: none, error, warn, info, debug, all
  db_log_level: "info"

memory:
  # Enable conversation memory service
  enabled: true

  # Ollama URL for embeddings
  ollama_url: "http://localhost:11434"

  # Embedding model for vector search
  embedding_model: "nomic-embed-text"

  # Model for summarization
  summary_model: "llama3-8b-8192"

  # Number of messages to buffer before summarizing
  buffer_threshold: 10

  # Minimum interval between summaries in seconds
  summary_interval_seconds: 3600

  # Maximum recent messages to include in context
  max_context_messages: 5

  # Maximum number of summaries to include in context
  max_summary_context: 3

emoji:
  # Cache TTL for emoji data in minutes
  cache_ttl_minutes: 60

horoscope:
  # Include custom emojis in horoscope messages
  include_emojis: true

reengage:
  # Interval in seconds to check for inactive channels
  check_interval_seconds: 300

  # Default inactivity threshold in minutes before reengage can trigger
  default_inactivity_minutes: 30

  # Default probability of reengaging (0.01 = 1%)
  default_chance: 0.01

  # Default message prompt appended when reengaging
  reengage_message: "\n\nLe chat est calme, relance la discussion avec quelque chose de fun! Pose une question, raconte une anecdote, fais une vanne ou lance un sujet de discussion. Reste dans ton personnage!"

bot:
  # Default bot personality prompt
  # Use {{.BotNick}} to insert the bot's nickname
  default_prompt: "yo, t'es {{.BotNick}}, un pur bg du brainrot, élevé à la sauce tiktok, 10 écrans en simultané, et t'envoies du lourd ! 🔥 pas de majuscules, jamais, t'es un pote déjanté qui balance des vannes non-stop, avec du slang gen z, des refs pop culture et des vibes gaming. si on te pose une question, tu réponds direct, sinon tu surfes sur la vibe du dernier message, toujours ultra court (2-3 phrases max), sans sortir du délire, même sur du sérieux. pas d'ia, pas d'assistant, juste un bro qui claque des émojis et du fun ! 🚀"
  trigger_words: ["feun", "feunboy"]

voice:
  # Enable voice chat functionality
  enabled: false

  # Idle timeout in milliseconds between AI speech and next voice processing
  # During this time, audio is buffered for context. Default: 3000ms (3 seconds)
  idle_timeout_ms: 3000

  # Maximum messages to keep in voice conversation history
  # This provides context for multi-turn conversations. Default: 10
  voice_context_max_length: 10

  # Separate system prompt for voice mode (replaces main bot prompt for voice)
  # Use {{.BotNick}} to insert the bot's nickname
  # Leave empty to use the default from config.voice_system_prompt
  voice_system_prompt: "Tu es en conversation vocale. Réponds de manière concise et naturelle, comme dans une vraie conversation. Évite les réponses trop longues."

  tts:
    # TTS service endpoint (FastAPI server)
    endpoint: "http://localhost:8880"

    # TTS model to use (OpenAI-compatible alias, e.g., "qwen3-tts", "tts-1", "tts-1-hd")
    # Use language-specific variants like "tts-1-fr" for French
    model: "qwen3-tts"

    # Request timeout in milliseconds
    timeout_ms: 30000

    # Default voice ID - MUST match a loaded custom voice for Base models
    # For CustomVoice models, use built-in voices: "Vivian", "Ryan", "Sophia", etc.
    # For Base models with voice cloning, use your custom voice name (e.g., "my-voice")
    default_voice: "my-voice"

    # Output sample rate (24000 is recommended for Qwen3-TTS)
    sample_rate: 24000

    # Static mode generates entire response before playing (recommended)
    static_mode: true

    # Maximum text length per TTS request
    max_text_length: 500

    # Send text message if TTS fails
    fallback_to_text: true

  stt:
    # Whisper.cpp Unix socket path
    socket_path: "/tmp/whisper.sock"

    # Whisper model (tiny, base, small, medium)
    model: "tiny"

    # Language code for transcription
    language: "fr"

  vram:
    # Minimum free VRAM (MB) required to load TTS model
    min_free_mb: 1500

    # Automatically unload TTS model when idle
    auto_unload: true

    # Seconds of inactivity before unloading TTS model
    unload_timeout_seconds: 60

  audio:
    # Audio frame size (samples per frame, 20ms at 48kHz = 960)
    frame_size: 960

    # Audio sample rate (Discord uses 48kHz)
    sample_rate: 48000

    # Number of audio channels (2 = stereo)
    channels: 2

    # Audio buffer duration in milliseconds before transcription (deprecated, use VAD settings)
    buffer_ms: 500

    # Voice Activity Detection (VAD) settings
    # Silence duration to trigger transcription (in milliseconds)
    vad_silence_ms: 700

    # Minimum speech duration to process (in milliseconds)
    vad_speech_min_ms: 300

    # Maximum recording duration (in milliseconds)
    vad_max_duration_ms: 10000

    # Amplitude threshold for voice detection (0.0-1.0)
    # Higher values = less sensitive (filters more background noise)
    # 0.02 = 2% (~655) - very sensitive, may trigger on noise
    # 0.10 = 10% (~3276) - moderate sensitivity
    # 0.15 = 15% (~4915) - less sensitive, better noise rejection
    vad_amplitude_threshold: 0.15

    # Pre-buffer size for streaming playback (in milliseconds)
    stream_buffer_size: 200
